<text x="40" y="733" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">Legendă: ↑ eliberare / sosire; dreptunghi = job; × = eveniment respins înainte de publicarea alarmei.</text>
<text x="40" y="771" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Alarme la 2.1 s și 8.1 s: Δ = 6 s ≥ 5 s. Cele de la 4.1 s și 6.1 s sunt prea apropiate de ultima acceptată.</text>
<text x="40" y="808" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Lățimile joburilor sunt simbolice. Thread-urile Java și MQTT nu oferă garanții hard real-time.</text>
